# Po wypchnięciu tagu vX.Y.Z buduje MXSync.exe i publikuje go jako wydanie na GitHubie.
# Aplikacja (przycisk „Sprawdź aktualizacje”) pobiera właśnie ten plik.
name: Wydanie

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wersja z tagu
        shell: bash
        run: |
          printf '"""Wersja aplikacji – porównywana z najnowszym wydaniem na GitHubie (tag vX.Y.Z)."""\nVERSION = "%s"\nREPO = "%s"\n' \
            "${GITHUB_REF_NAME#v}" "${GITHUB_REPOSITORY}" > utils/version.py
          cat utils/version.py

      - name: Budowanie
        run: |
          python -m pip install -r requirements.txt
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name MXSync --collect-data customtkinter `
            --icon assets\icon.ico --add-data "assets\icon.ico;assets" --add-data "assets\wheel.png;assets" main.py

      - name: Publikacja wydania
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MXSync.exe
          generate_release_notes: true
