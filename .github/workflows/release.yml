# Po wypchnięciu tagu vX.Y.Z buduje instalator MXSync-Setup.exe (stała nazwa – link „releases/latest/download/MXSync-Setup.exe” w README zawsze działa) i publikuje go jako wydanie.
# Aplikacja (przycisk „Sprawdź aktualizacje”) pobiera ten instalator i uruchamia go po cichu.
# W wydaniu ma być tylko JEDEN plik .exe – stare wersje (1.2.x) biorą pierwszy .exe z wydania.
name: Wydanie

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wersja z tagu
        shell: bash
        run: |
          printf '"""Wersja aplikacji – porównywana z najnowszym wydaniem na GitHubie (tag vX.Y.Z)."""\nVERSION = "%s"\nREPO = "%s"\n' \
            "${GITHUB_REF_NAME#v}" "${GITHUB_REPOSITORY}" > utils/version.py
          cat utils/version.py

      - name: Budowanie aplikacji
        run: |
          python -m pip install -r requirements.txt
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name MXSync --collect-data customtkinter --hidden-import pystray._win32 `
            --icon assets\icon.ico --add-data "assets\icon.ico;assets" --add-data "assets\wheel.png;assets" --add-data "assets\logo.gif;assets" main.py

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { throw "Brak ISCC.exe" }
          & $iscc "/DAppVersion=$($env:GITHUB_REF_NAME.TrimStart('v'))" installer\MXSync.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Publikacja wydania
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/MXSync-Setup.exe
          generate_release_notes: true
